<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor Moreira — Imobilizado — Quiz 1 — professor</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f7fc;color:#142443}body{display:flex;flex-direction:column}header{background:#17295c;color:white;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:19px}.tag{background:#e8e9ff;color:#273b83;border-radius:30px;padding:6px 12px;font-weight:800}main{flex:1;position:relative;min-height:65vh;display:flex;flex-direction:column;padding:18px 25px 105px}.sheet{background:white;border:2px solid #d9dff0;border-top:8px solid #6854c5;border-radius:15px;box-shadow:0 8px 30px #14244313;padding:clamp(18px,3vw,36px);width:100%;min-height:65vh;position:relative}.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:65vh}.intro h1{font-size:clamp(29px,4.5vw,58px);line-height:1.15;margin:8px}.intro h2{font-size:clamp(25px,3.5vw,44px);color:#4837a6}.intro p{font-size:24px}.questionTitle{font-size:clamp(19px,2.3vw,29px);color:#4633a5;margin:0 0 12px}.source{font-size:16px;color:#526180;margin-bottom:18px}.statement{font-size:clamp(19px,2vw,28px);line-height:1.5;font-weight:650;white-space:pre-wrap}.option{font-size:clamp(18px,1.7vw,24px);padding:12px 16px;margin:10px 0;border:2px solid #d9dff0;border-radius:10px;line-height:1.35;background:#fff;text-align:left;width:100%;color:inherit}.option.selected{border-color:#6652d0;background:#eeeaff}.option.correct{border-color:#198f52;background:#e6f7ec}.option.wrong{border-color:#c52f3b;background:#ffeaed}.answer{font-size:clamp(19px,1.8vw,25px);line-height:1.65;white-space:pre-wrap;color:#a8182d}.answerKey{font-size:clamp(24px,2.6vw,34px);color:#17824c;font-weight:900;margin-bottom:20px}footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#17295c;padding:12px 18px;z-index:9}button{cursor:pointer;border:0;border-radius:10px;background:#eeeaff;color:#2d236d;padding:12px 17px;font-size:16px;font-weight:800}button:disabled{opacity:.4;cursor:default}.primary{background:#6d57d4;color:white}.green{background:#17864a;color:white}.red{background:#b52a39;color:white}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#e9eaf9;padding:8px;border-radius:10px;margin-bottom:12px}.tools button{padding:8px 11px}.tools button.active{outline:3px solid #29296c}.tools label{font-weight:bold}.tools input{vertical-align:middle}#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:3;cursor:crosshair;pointer-events:none}.teacher .sheet{min-height:75vh}.teacher main{padding:12px 12px 120px}.teacher .statement{font-size:clamp(21px,2.1vw,30px)}.counter{color:white;font-weight:bold}.score{font-size:clamp(23px,3vw,35px);text-align:center;line-height:1.7} .note{color:#57617d;font-size:15px} @media(max-width:650px){main{padding:9px 9px 125px}.sheet{padding:17px}.option{font-size:18px}footer{justify-content:center;padding:8px}footer button{padding:10px;font-size:14px}header strong{font-size:15px}}</style></head><body class="teacher"><header><strong>CURSO DE CONTABILIDADE • PROFESSOR MOREIRA</strong><span class="tag">FGV | CPC 27 | QUIZ 1 | PROFESSOR</span></header><main><div id="tools" class="tools"><button id="penToggle" onclick="setTool(tool==='off'?'pen':'off')">DESATIVAR CANETA</button><button onclick="setTool('pen')">CANETA</button><button onclick="setTool('highlighter')">MARCA-TEXTO</button><button onclick="setTool('erase')">BORRACHA</button><button onclick="setColor('#e02d32')" style="background:#e02d32;color:white">VERMELHA</button><button onclick="setColor('#1a65d1')" style="background:#1a65d1;color:white">AZUL</button><button onclick="setColor('#161616')" style="background:#161616;color:white">PRETA</button><button onclick="setColor('#18824b')" style="background:#18824b;color:white">VERDE</button><button onclick="color='#f2d01e';setTool('highlighter')" style="background:#f2d01e">AMARELO</button><label>Espessura <input type="range" min="1" max="14" value="3" oninput="size=+this.value"></label><button onclick="clearBoard()">LIMPAR LOUSA</button></div><section class="sheet"><div id="content"></div></section></main><footer><button onclick="prev()" id="prev">← VOLTAR</button><button class="green" onclick="teacherSignal(true)">✓ ACERTOU</button><button class="red" onclick="teacherSignal(false)">✗ ERROU</button><span id="counter" class="counter"></span><button onclick="restart()">↻ REINICIAR</button><button class="primary" onclick="next()" id="next">SEGUIR →</button></footer><script>const Q=[{"n": 1, "source": "FGV - Aud (CAGE RS)/SEFAZ RS/2025", "statement": "Uma sociedade empresária exerce a atividade de arrendamento de imóveis a terceiros. Em 31/12/2024, ela atuou como arrendadora e realizou um arrendamento operacional de um prédio de quatro andares a uma escola em um contrato de dois anos. O prédio estava avaliado no Balanço Patrimonial da sociedade empresária por R$ 800.000. O aluguel mensal era de R$ 10.000. O primeiro andar da escola era destinado à secretaria e a atendimentos e o restante era destinado às aulas. Assinale a opção que indica a classificação do prédio no Balanço Patrimonial da sociedade empresária em 31/12/2024:", "options": [["A", "R$ 60.000 em ativo imobilizado e R$ 180.000 em propriedade para investimentos."], ["B", "R$ 200.000 em ativo imobilizado e R$ 600.000 em propriedade para investimentos."], ["C", "R$ 240.000 em propriedade para investimentos."], ["D", "R$ 800.000 em ativo imobilizado."], ["E", "R$ 800.000 em propriedade para investimentos."]], "answer": "D", "explanation": "Quando o arrendamento de imóveis é a atividade principal da empresa, estes imóveis são utilizados na sua atividade operacional, representando os meios pelos quais a empresa gera receitas em sua operação normal. Esses ativos estão diretamente relacionados à sua atividade-fim e, portanto, devem ser classificados como ativo imobilizado.\n\nA propriedade para investimento, por outro lado, seria aplicável quando uma empresa mantém imóveis para gerar renda secundária, não relacionada à sua atividade principal. Por exemplo, uma indústria que possui um imóvel e o aluga para terceiros.\n\nPortanto, sendo o arrendamento de imóveis a atividade principal da sociedade empresária em questão, o prédio avaliado em R$ 800.000 deve ser classificado integralmente como ativo imobilizado no Balanço Patrimonial em 31/12/2024."}, {"n": 2, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025", "statement": "Em 01/09/2024, uma sociedade empresária localizada em Belo Horizonte adquiriu aparelhos de informática de Manaus por R$ 40.000,00. O frete para a entrega por caminhão era de R$ 2.000,00. No entanto, para receber os aparelhos mais rápido, a sociedade empresária solicitou a entrega por avião e pagou o valor de R$ 5.500,00 pelo frete. A instalação dos aparelhos no escritório custou R$ 1.000,00. Ainda, foram gastos R$ 2.000,00 com testes para verificar se os aparelhos estavam funcionando corretamente. O valor dos aparelhos de informática a serem registrados no ativo imobilizado da sociedade empresária é de", "options": [["A", "R$ 43.000,00."], ["B", "R$ 45.000,00."], ["C", "R$ 46.500,00."], ["D", "R$ 48.500,00."]], "answer": "D", "explanation": "O CPC 27, itens 16 e 17, determina que integram o custo o preço de compra e os gastos diretamente necessários para deixar o bem disponível para o uso pretendido. Preço dos aparelhos: R$ 40.000; frete aéreo efetivamente contratado: R$ 5.500; instalação: R$ 1.000; testes: R$ 2.000. Soma: 40.000 + 5.500 + 1.000 + 2.000 = R$ 48.500. O frete rodoviário de R$ 2.000 era apenas uma opção não utilizada; por isso não entra. Alternativa D."}, {"n": 3, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025", "statement": "Em fevereiro de 2025, um hotel adquiriu um televisor de 98 polegadas para que os seus hospedes assistissem a cerimônia do Oscar, em março. O preço do televisor era de R$ 40.000,00. Na data da compra foi acordado com o fornecedor que o pagamento seria realizado por Pix e, em decorrência, o hotel obteve uma redução de 5% sobre o preço original. Assinale a opção que indica a contrapartida da diminuição de R$ 38.000,00 na conta “Disponibilidades”, nas demonstrações contábeis do hotel.", "options": [["A", "Ativo imobilizado de R$ 38.000,00."], ["B", "Ativo imobilizado de R$ 40.000,00 e receita financeira de R$ 2.000,00."], ["C", "Ativo imobilizado de R$ 40.000,00 e outras receitas de R$ 2.000,00."], ["D", "Ativo imobilizado de R$ 40.000,00 e retificação do ativo imobilizado de R$ 2.000,00."]], "answer": "A", "explanation": "O desconto de 5% foi concedido no próprio preço de aquisição em razão da forma de pagamento. CPC 27, item 16(a): descontos comerciais e abatimentos reduzem o custo inicial. Cálculo: 40.000 × 5% = R$ 2.000; valor efetivamente pago = 40.000 − 2.000 = R$ 38.000. Lançamento: débito em Imobilizado R$ 38.000 e crédito em Disponibilidades R$ 38.000. Não há receita financeira separada nessa operação. Alternativa A."}, {"n": 4, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2025", "statement": "Uma empresa adquiriu uma máquina e registrou na contabilidade os seguintes dispêndios: • Preço de aquisição: R$ 500.000,00; • Imposto de importação: R$ 50.000,00 (não recuperável); • Preparação do local: R$ 100.000,00; • Custo com materiais consumido na realização de testes de funcionamento: R$ 50.000,00; • Honorários dos técnicos que realizaram os testes: R$ 60.000,00; • Vida útil estimada: 10 anos; • Valor residual: R$ 100.000,00. De acordo com a NBC TG 27 (R4) - ATIVO IMOBILIZADO, o custo da máquina, ou seja, o valor contábil de registro inicial desse imobilizado, será de", "options": [["A", "R$ 500.000,00."], ["B", "R$ 550.000,00."], ["C", "R$ 650.000,00."], ["D", "R$ 760.000,00."]], "answer": "D", "explanation": "Para o reconhecimento inicial, some os custos diretamente atribuíveis à máquina (CPC 27, itens 16 e 17): aquisição 500.000 + imposto de importação não recuperável 50.000 + preparação do local 100.000 + materiais de testes 50.000 + técnicos de testes 60.000 = R$ 760.000. Vida útil e valor residual não reduzem o custo de entrada; serão considerados no cálculo da depreciação futura. Alternativa D."}, {"n": 5, "source": "FGV - Ana CI (Pref Canaã Carajás)/Pref Canaã Carajás/2025", "statement": "Uma entidade deprecia os seus ativos imobilizados com base no método da linha reta. Em 01/01/2022, a entidade adquiriu de terceiros um veículo usado, fabricado em 2020, por R$40.000 para ser utilizado no deslocamento de seus empregados. Na data, a entidade esperava utilizar o veículo por cinco anos e vende-lo por R$10.000. Em 31/01/2024, a entidade vendeu o veículo por R$35.000. Assinale a opção que indica o resultado obtido com a venda.", "options": [["A", "R$3.929,00."], ["B", "R$7.500,00."], ["C", "R$11.667,00."], ["D", "R$13.929,00."], ["E", "R$17.500,00."]], "answer": "B", "explanation": "Valor depreciável = custo − valor residual = 40.000 − 10.000 = R$ 30.000. Depreciação anual linear = 30.000/5 = R$ 6.000; mensal = R$ 500. De 01/01/2022 até a venda em 31/01/2024, são 25 meses: depreciação acumulada = 25 × 500 = R$ 12.500. Valor contábil líquido = 40.000 − 12.500 = R$ 27.500. Resultado da venda = 35.000 − 27.500 = R$ 7.500 de ganho. Alternativa B."}, {"n": 6, "source": "FGV - AJ TRT24/TRT 24/Administrativa/Contabilidade/2025", "statement": "Uma sociedade empresária do setor de engenharia tem uma biblioteca, que é utilizada por seus empregados para obter informações técnicas. Os livros da biblioteca são classificados no balanço patrimonial da sociedade empresária como", "options": [["A", "ativo intangível."], ["B", "Investimentos."], ["C", "ativo Imobilizado."], ["D", "ativo circulante."], ["E", "ativo realizável a longo prazo."]], "answer": "C", "explanation": "Os livros físicos compõem uma biblioteca técnica usada por empregados em atividades de engenharia por mais de um período. São bens corpóreos mantidos para suporte à prestação de serviços, enquadrados na definição de imobilizado do CPC 27, item 6. Não são intangíveis, pois possuem substância física, nem estoques destinados à revenda. Alternativa C."}, {"n": 7, "source": "FGV - Per Cont (CFC)/CFC/2025", "statement": "Uma empresa S.A. desembolsou os seguintes valores para a construção de uma mineradora: preparação do local de R$ 40.000,00; montante de caixa total dispendido para a construção de R$ 200.000,00. Ainda, era necessário obter uma licença governamental para construir a mineradora. Havia uma condição na licença de que, no final da vida útil esperada da mineradora, o proprietário a desmontasse, removesse quaisquer detritos e restaurasse o terreno à sua condição anterior. Essas condições seriam qualificadas como uma obrigação presente resultante de um acontecimento passado e que provavelmente resultará numa futura saída de recursos no valor presente de R$ 80.000,00. Os custos administrativos foram de R$ 20.000,00 e os outros custos indiretos foram de R$ 10.000,00. Considerando-se as informações apresentadas e os preceitos da NBC TG 25 (R2) e da NBC TG 27, um perito contábil, ao analisar a situação, identificou que a empresa contabilizou corretamente um custo para o imobilizado da mineradora de", "options": [["A", "R$ 240.000,00."], ["B", "R$ 270.000,00."], ["C", "R$ 320.000,00."], ["D", "R$ 240.000,00 e uma perda de R$ 80.000,00 no resultado devido à provisão."], ["E", "R$ 270.000,00 e uma perda de R$ 80.000,00 no resultado devido à provisão."]], "answer": "C", "explanation": "O CPC 27 inclui no custo de um ativo os gastos necessários à construção e a estimativa inicial da obrigação de desmontagem e recuperação do local, desde que reconhecível como provisão (CPC 25). Cálculo: preparação 40.000 + construção 200.000 + valor presente da restauração 80.000 = R$ 320.000. Custos administrativos gerais de R$ 20.000 e indiretos não atribuíveis de R$ 10.000 ficam fora. A contrapartida dos R$ 80.000 é uma provisão no passivo, não despesa imediata. Alternativa C."}, {"n": 8, "source": "FGV - Per Cont (CFC)/CFC/2025", "statement": "Durante um processo de avaliação patrimonial, um perito contábil foi contratado para revisar os registros contábeis de uma empresa S.A. do setor industrial, que decidiu desativar uma fábrica devido à adoção de novas tecnologias mais sustentáveis. Com isso, o valor residual de suas máquinas foi reduzido e a vida útil encurtada, pois a desmobilização antecipada inviabilizou seu uso futuro. Inicialmente, em 01/01/20x3 o ativo – fábrica foi contabilizado no valor de R$ 1.000,00 com depreciação pelo método linear de vida útil de 10 anos e valor residual no valor de R$ 100,00. Em 01/01/20x5, a vida útil foi reduzida para cinco anos e o valor residual para zero. Considerando-se as informações apresentadas e os preceitos da NBC TG 23 e NBC TG 27, o perito contábil analisou a adequação da contabilização da depreciação a partir de 01/01/20X5 e verificou que a nova depreciação anual pelo método linear deve ser de", "options": [["A", "R$ 160,00 e a alteração deve ser contabilizada como mudança de política contábil."], ["B", "R$ 160,00 e a alteração deve ser contabilizada como mudança de estimativa contábil."], ["C", "R$ 164,00 e a alteração deve ser contabilizada como mudança de política contábil."], ["D", "R$ 164,00 e a alteração deve ser contabilizada como mudança de estimativa contábil."], ["E", "R$ 180,00 e a alteração deve ser contabilizada como mudança de política contábil."]], "answer": "D", "explanation": "Depreciação original: (1.000 − 100)/10 = R$ 90 por ano. Em 01/01/X5, após dois anos completos, a depreciação acumulada é R$ 180 e o valor contábil é R$ 820. O novo valor residual é zero. Se os cinco anos indicados forem a nova vida útil REMANESCENTE, a nova quota é 820/5 = R$ 164 ao ano, alternativa D, mudança de estimativa contábil (CPC 23). Se cinco anos significarem vida útil TOTAL desde X3, restariam três anos, e o resultado seria diferente. O gabarito pressupõe cinco anos remanescentes; explicitar essa interpretação em aula."}, {"n": 9, "source": "FGV - Ana GM (Pref SJC)/Pref SJC/Ciências Contábeis/2025", "statement": "Uma concessionária oferecia serviços de aluguel e de venda de carros. As receitas obtidas com cada tipo de serviço correspondiam à metade do faturamento da concessionária. Em 31/12/2024, os carros destinados à venda, com expectativa de negociação no curto prazo, tinham valor contábil de R$ 300.000,00, enquanto os carros destinados ao aluguel tinham valor contábil de R$ 200.000,00. A apresentação dos carros no balanço patrimonial da concessionária em 31/12/2024 é:", "options": [["A", "ativo circulante: R$ 500.000,00."], ["B", "ativo imobilizado: R$ 500.000,00."], ["C", "ativo circulante: R$ 300.000,00; investimentos: R$ 200.000,00."], ["D", "ativo imobilizado: R$ 300.000,00; investimentos: R$ 200.000,00."], ["E", "ativo circulante: R$ 300.000,00; ativo imobilizado: R$ 200.000,00."]], "answer": "E", "explanation": "Os carros disponíveis para venda no curso normal da atividade são estoques, classificados no ativo circulante (CPC 16): R$ 300.000. Os carros destinados à locação, usados na prestação continuada de serviços, são imobilizado (CPC 27): R$ 200.000. O fato de cada linha gerar metade da receita não altera a classificação dos veículos. Alternativa E."}, {"n": 10, "source": "FGV - AL (CAM DEP)/CAM DEP/Consultor Legislativo/Área IV/2025", "statement": "Um escritório de contabilidade adquiriu, em 01/07/2018, móveis para utilizar em suas salas de reunião por R$ 20.000. Na data, estimou-se vida útil de 10 anos. No entanto, em 31/12/2022, o escritório passou a atender seus clientes somente à distância. Deste modo, resolveu fazer uma permuta de seus móveis por computadores, que pertenciam a outro escritório. Na data, o valor justo dos móveis era de R$ 12.000. Já os computadores apresentavam valor contábil de R$ 10.000. Após a realização da permuta, em 31/12/2022, e considerando que a transação tem natureza comercial, os computadores devem ser apresentados no Balanço Patrimonial do escritório de contabilidade por:", "options": [["A", "R$ 10.000."], ["B", "R$ 10.500."], ["C", "R$ 11.000,"], ["D", "R$ 12.000,"], ["E", "R$ 20.000,"]], "answer": "D", "explanation": "Em permuta com substância comercial, o CPC 27, item 24, em regra determina mensuração pelo valor justo, salvo exceções de mensuração confiável. O valor justo dos móveis entregues é R$ 12.000; esse valor fundamenta o custo dos computadores recebidos. O valor contábil de R$ 10.000 informado para os computadores no outro escritório não determina a mensuração do adquirente. Alternativa D."}];const MODE='professor';const GROUP=1;let index=-1,side=0,choices={},marks={},tool='pen',color='#e02d32',size=3;const key='moreira-cpc27-'+MODE+'-'+GROUP;try{const old=JSON.parse(localStorage.getItem(key)||'{}');choices=old.choices||{};marks=old.marks||{}}catch(e){}const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify({choices,marks}))}catch(e){}}function intro(){return `<div class="intro"><h1>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</h1><h1>=================</h1><h2>SÓ QUESTÕES DA FGV</h2><h2>ATIVO IMOBILIZADO — CPC 27</h2><p>QUIZ ${GROUP} • QUESTÕES ${Q[0].n} A ${Q[9].n}</p><button class="primary" onclick="next()">COMEÇAR</button></div>`}function qhtml(q){return `<h2 class="questionTitle">QUESTÃO ${String(q.n).padStart(2,'0')} — FGV</h2><div class="source">${esc(q.source)}</div><div class="statement">${esc(q.statement)}</div><div class="options">${q.options.map(o=>`<button class="option ${choices[q.n]===o[0]?'selected':''}" onclick="choose('${o[0]}')" ${MODE==='professor'?'disabled':''}><b>${o[0]})</b> ${esc(o[1])}</button>`).join('')}</div>`}function ahtml(q){let o=q.options.find(x=>x[0]===q.answer);return `<h2 class="questionTitle">RESOLUÇÃO DA QUESTÃO ${String(q.n).padStart(2,'0')}</h2><div class="answerKey">GABARITO: LETRA ${q.answer} — ${esc(o?o[1]:'')}</div><div class="answer">${esc(q.explanation)}</div>`}function score(){let correct=Q.filter(q=>choices[q.n]===q.answer).length,wrong=Q.filter(q=>choices[q.n]&&choices[q.n]!==q.answer).length,blank=10-correct-wrong;return `<div class="intro score"><h2>RESULTADO DO QUIZ ${GROUP}</h2><div>Acertos: ${correct} / 10<br>Erros: ${wrong}<br>Sem resposta: ${blank}<br>Aproveitamento: ${correct*10}%</div><button class="primary" onclick="restart()">REINICIAR</button></div>`}function render(){const introPage=index===-1,finished=index===Q.length;$('#content').innerHTML=introPage?intro():finished?score():side===0?qhtml(Q[index]):ahtml(Q[index]);$('#counter').textContent=introPage?'Tela inicial':finished?'Resultado':`Questão ${index+1}/10 • ${side?'RESPOSTA':'PERGUNTA'}`;$('#prev').disabled=introPage;$('#next').textContent=finished?'INÍCIO':'SEGUIR →';if(MODE==='professor'){const tools=$('#tools');tools.style.display=(introPage||finished)?'none':'flex';const sheet=$('.sheet');let board=document.createElement('canvas');board.id='board';sheet.appendChild(board);initCanvas(board);$('#penToggle').textContent=tool==='off'?'ATIVAR CANETA':'DESATIVAR CANETA';} }function choose(v){if(index<0||index>=10||side||MODE!=='aluno')return;choices[Q[index].n]=v;save();render()}function next(){if(index===10){index=-1;side=0}else if(index===-1){index=0;side=0}else if(side===0){side=1}else if(index===9){index=10;side=0}else{index++;side=0}render()}function prev(){if(index===10){index=9;side=1}else if(index===-1)return;else if(side===1)side=0;else if(index===0)index=-1;else{index--;side=1}render()}function restart(){if(confirm('Reiniciar este quiz e apagar respostas e anotações?')){choices={};marks={};save();index=-1;side=0;render()}}function flash(ok){const sh=$('.sheet');sh.style.boxShadow=ok?'0 0 0 9px #31b46d':'0 0 0 9px #f35d68';setTimeout(()=>sh.style.boxShadow='',450)}function teacherSignal(ok){flash(ok)}function setTool(t){tool=t;render()}function setColor(c){color=c;tool='pen';render()}function initCanvas(c){let rect=c.parentElement.getBoundingClientRect();c.width=Math.max(1,Math.round(rect.width*devicePixelRatio));c.height=Math.max(1,Math.round(rect.height*devicePixelRatio));let ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);let w=rect.width,h=rect.height;let k=index+'-'+side;let strokes=marks[k]||[];function paint(st){if(!st.points.length)return;ctx.strokeStyle=st.color;ctx.lineWidth=st.width;ctx.globalAlpha=st.alpha||1;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();st.points.forEach((p,i)=>{let x=p[0]*w,y=p[1]*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(st.points.length===1){let p=st.points[0];ctx.lineTo(p[0]*w+.1,p[1]*h+.1)}ctx.stroke();ctx.globalAlpha=1}strokes.forEach(paint);c.style.pointerEvents=tool==='off'?'none':'auto';c.style.cursor=tool==='erase'?'cell':'crosshair';let active=null;c.onpointerdown=e=>{if(tool==='off')return;e.preventDefault();c.setPointerCapture(e.pointerId);let p=point(e);active={color:tool==='erase'?'#ffffff':color,width:tool==='erase'?25:tool==='highlighter'?22:size,alpha:tool==='highlighter'?.32:1,points:[p]};strokes.push(active);marks[k]=strokes;paint(active)};c.onpointermove=e=>{if(!active)return;e.preventDefault();active.points.push(point(e));ctx.clearRect(0,0,w,h);strokes.forEach(paint)};c.onpointerup=()=>{active=null;save()};c.onpointercancel=()=>{active=null;save()};function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}}function clearBoard(){if(index<0||index>=10)return;delete marks[index+'-'+side];save();render()}window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});render();</script></body></html>
